name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-quality:
    name: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install declared toolchain
        run: rustup toolchain install --profile minimal --component rustfmt,clippy
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - run: RUSTDOCFLAGS=-Dwarnings cargo doc --workspace --all-features --no-deps

  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install MSRV
        run: rustup toolchain install 1.92.0 --profile minimal
      - run: cargo +1.92.0 check --workspace --all-targets
      - run: cargo +1.92.0 test --workspace --all-targets

  platform-build:
    name: platform-build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install declared toolchain
        run: rustup toolchain install --profile minimal
      - run: cargo check --workspace --all-targets --all-features

  python-contracts:
    name: python-contracts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e 'sdk/python[test]'
      - run: python -m unittest discover -s sdk/python/tests -v
      - run: python -m pip wheel --no-deps --no-build-isolation sdk/python -w dist

  package-policy:
    name: package-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install declared toolchain
        run: rustup toolchain install --profile minimal
      - run: cargo package -p rawscope-core --allow-dirty
      - name: Validate private package graph
        run: cargo metadata --format-version 1 --no-deps
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.18.3 --locked
      - run: cargo deny check

