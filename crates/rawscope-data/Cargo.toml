[package]
name = "rawscope-data"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Typed local dataset storage and source adapters for RawScope"

[dependencies]
arrow-array = "59.1.0"
arrow-schema = "59.1.0"
csv = "1.3.1"
parquet = { version = "59.1.0", features = ["arrow"] }
rawscope-core = { version = "0.1.0", path = "../rawscope-core" }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "local_ingest"
harness = false
