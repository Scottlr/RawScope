[package]
name = "rawscope-render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "GPU presentation and evidence-facing rendering primitives for RawScope"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
rawscope-core = { version = "0.1.0", path = "../rawscope-core" }
rawscope-analysis = { version = "0.1.0", path = "../rawscope-analysis" }
rawscope-data = { version = "0.1.0", path = "../rawscope-data" }
rawscope-evidence = { version = "0.1.0", path = "../rawscope-evidence" }
rawscope-gpu = { version = "0.1.0", path = "../rawscope-gpu" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
wgpu = "29.0.3"

[dev-dependencies]
criterion = { workspace = true }
pollster = "0.4.0"

[[bench]]
name = "density_reference"
harness = false

[[bench]]
name = "gpu_density"
harness = false
