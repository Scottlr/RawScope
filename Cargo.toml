[workspace]
members = [
    "crates/rawscope-core",
    "crates/rawscope-data",
    "crates/rawscope-gpu",
    "crates/rawscope-render",
    "crates/rawscope-analysis",
    "crates/rawscope-evidence",
    "crates/rawscope-session",
    "crates/rawscope-session-contracts",
    "crates/rawscope-adapters",
    "apps/rawscope-workbench",
    "showcases/support",
    "showcases/lichess",
    "showcases/nab",
    "showcases/nasa",
    "showcases/smd",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Scottlr/RawScope"
homepage = "https://github.com/Scottlr/RawScope"

[workspace.dependencies]
criterion = "0.8.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
proptest = "1.11.0"
