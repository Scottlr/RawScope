[workspace]
members = [
    "crates/rawscope-core",
    "crates/rawscope-data",
    "crates/rawscope-gpu",
    "crates/rawscope-render",
    "crates/rawscope-analysis",
    "crates/rawscope-evidence",
    "crates/rawscope-session",
    "crates/rawscope-session-contracts",
    "apps/rawscope-workbench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
criterion = "0.8.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
