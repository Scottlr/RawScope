[package]
name = "rawscope-workbench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Native RawScope visual analytics workbench"

[dependencies]
egui = "0.35.0"
egui-wgpu = "0.35.0"
egui-winit = "0.35.0"
iconflow = { version = "1.0.0", default-features = false, features = ["pack-lucide"] }
pollster = "0.4.0"
rawscope-core = { version = "0.1.0", path = "../../crates/rawscope-core" }
rawscope-analysis = { version = "0.1.0", path = "../../crates/rawscope-analysis" }
rawscope-data = { version = "0.1.0", path = "../../crates/rawscope-data", features = ["csv", "parquet"] }
rawscope-evidence = { version = "0.1.0", path = "../../crates/rawscope-evidence" }
rawscope-gpu = { version = "0.1.0", path = "../../crates/rawscope-gpu" }
rawscope-render = { version = "0.1.0", path = "../../crates/rawscope-render" }
rawscope-session = { version = "0.1.0", path = "../../crates/rawscope-session" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
winit = "0.30.13"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "evidence_export"
harness = false

