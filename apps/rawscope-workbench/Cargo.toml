[package]
name = "rawscope-workbench"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
egui = "0.35.0"
egui-wgpu = "0.35.0"
egui-winit = "0.35.0"
iconflow = { version = "1.0.0", default-features = false, features = ["pack-lucide"] }
pollster = "0.4.0"
rawscope-core = { path = "../../crates/rawscope-core" }
rawscope-data = { path = "../../crates/rawscope-data" }
rawscope-gpu = { path = "../../crates/rawscope-gpu" }
rawscope-render = { path = "../../crates/rawscope-render" }
rawscope-session = { path = "../../crates/rawscope-session" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
winit = "0.30.13"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "evidence_export"
harness = false

