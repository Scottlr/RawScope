[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rawscope-sdk"
version = "0.1.0"
description = "Local Python bridge for the RawScope native visual analytics workbench"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.2", "pyarrow>=15"]
polars = ["polars>=0.20"]
arrow = ["pyarrow>=15"]
test = ["pandas>=2.2", "polars>=0.20", "pyarrow>=15"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
