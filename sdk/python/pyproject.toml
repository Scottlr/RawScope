[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rawscope-sdk"
version = "0.1.0"
description = "Local Python bridge for the RawScope native visual analytics workbench"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
